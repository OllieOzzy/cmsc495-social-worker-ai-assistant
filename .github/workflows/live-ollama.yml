name: Live Ollama Test

on:
  workflow_dispatch:
    inputs:
      run_quality_tests:
        description: Run the DAP quality cases after the smoke test
        type: boolean
        default: false

permissions:
  contents: read

env:
  OLLAMA_VERSION: '0.40.16'
  OLLAMA_MODEL: qwen3:4b
  RUN_LIVE_OLLAMA: '1'

jobs:
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up live Ollama tests
        uses: ./.github/actions/setup-live-ollama
      - name: Run Ollama smoke test
        run: python -m pytest tests/llm/test_live_ollama.py -v
      - name: Show Ollama logs if the job fails
        if: failure()
        run: |
          if [[ -f "$RUNNER_TEMP/ollama.log" ]]; then
            cat "$RUNNER_TEMP/ollama.log"
          fi

  dap-quality-tests:
    name: DAP Quality Tests
    needs: smoke-test
    if: ${{ inputs.run_quality_tests }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up live Ollama tests
        uses: ./.github/actions/setup-live-ollama
      - name: Run DAP quality tests
        run: python -m pytest tests/llm/test_dap_quality.py -v -s
      - name: Show Ollama logs if the job fails
        if: failure()
        run: |
          if [[ -f "$RUNNER_TEMP/ollama.log" ]]; then
            cat "$RUNNER_TEMP/ollama.log"
          fi
