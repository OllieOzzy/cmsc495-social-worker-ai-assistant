name: Live Ollama Test

on:
  workflow_dispatch:
    inputs:
      run_quality_tests:
        description: Run the Ubuntu DAP quality cases after all smoke tests pass
        type: boolean
        default: false

permissions:
  contents: read

env:
  OLLAMA_VERSION: '0.40.16'
  OLLAMA_MODEL: qwen3:4b
  RUN_LIVE_OLLAMA: '1'

jobs:
  smoke-test:
    name: Smoke Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run Ollama smoke test
        uses: ./.github/actions/setup-live-ollama
        with:
          suite: smoke

  dap-quality-tests:
    name: DAP Quality Tests
    needs: smoke-test
    if: ${{ inputs.run_quality_tests }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run DAP quality tests
        uses: ./.github/actions/setup-live-ollama
        with:
          suite: quality
