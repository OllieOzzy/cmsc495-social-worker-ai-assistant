name: Live Ollama Test

on:
  workflow_dispatch:
    inputs:
      run_quality_tests:
        description: Run the Ubuntu DAP quality cases after all smoke tests pass
        type: boolean
        default: false

permissions:
  contents: read

env:
  OLLAMA_VERSION: '0.40.16'
  OLLAMA_MODEL: qwen3:4b
  RUN_LIVE_OLLAMA: '1'

jobs:
  smoke-test:
    name: Smoke Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up live Ollama tests
        uses: ./.github/actions/setup-live-ollama
      - name: Run Ollama smoke test
        if: runner.os != 'Windows'
        run: python -m pytest tests/llm/test_live_ollama.py -v
      - name: Start Ollama and run the smoke test on Windows
        if: runner.os == 'Windows'
        env:
          OLLAMA_MODELS: ${{ runner.temp }}/ollama-models
        shell: pwsh
        run: |
          $ollama = Join-Path $env:RUNNER_TEMP 'ollama/ollama.exe'
          # Keep the server and the smoke test in the same Windows runner step.
          $server = Start-Process -FilePath $ollama -ArgumentList 'serve' -WindowStyle Hidden -PassThru `
            -RedirectStandardOutput "$env:RUNNER_TEMP/ollama.stdout.log" `
            -RedirectStandardError "$env:RUNNER_TEMP/ollama.log"
          try {
            curl.exe --fail --silent --show-error --retry 15 --retry-connrefused `
              --retry-delay 1 --max-time 5 http://127.0.0.1:11434/api/version
            if ($LASTEXITCODE -ne 0) { throw 'Ollama did not become ready.' }

            & $ollama show $env:OLLAMA_MODEL *> $null
            if ($LASTEXITCODE -ne 0) {
              & $ollama pull $env:OLLAMA_MODEL
              if ($LASTEXITCODE -ne 0) { throw 'Ollama could not pull the test model.' }
            }

            python -m pytest tests/llm/test_live_ollama.py -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            if (!$server.HasExited) { Stop-Process -InputObject $server }
          }
      - name: Show Ollama logs if the job fails
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "$env:RUNNER_TEMP/ollama*.log" | Get-Content

  dap-quality-tests:
    name: DAP Quality Tests
    needs: smoke-test
    if: ${{ inputs.run_quality_tests }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up live Ollama tests
        uses: ./.github/actions/setup-live-ollama
      - name: Run DAP quality tests
        run: python -m pytest tests/llm/test_dap_quality.py -v -s
      - name: Show Ollama logs if the job fails
        if: failure()
        run: |
          if [[ -f "$RUNNER_TEMP/ollama.log" ]]; then
            cat "$RUNNER_TEMP/ollama.log"
          fi
