name: CI Pipeline

# Run checks on pushes and pull requests. GitHub also lets us start CI manually.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Each job uses needs to wait for the earlier checks to pass.
jobs:
  # Catch mistakes in GitHub Actions settings, expressions, and job dependencies.
  workflow-lint:
    name: Workflow Linting
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint GitHub Actions workflows
        shell: bash
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          # Check the download against the checksum from the release page.
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  # Check YAML formatting in both workflows and shared actions under .github.
  workflow-formatting:
    name: Workflow Formatting
    needs: workflow-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check GitHub Actions YAML formatting
        run: >-
          npx --yes prettier@3.9.10 --single-quote --end-of-line auto
          --check ".github/**/*.{yml,yaml}"

  # Scan the GitHub Actions files for security issues.
  workflow-security:
    name: Workflow Security
    needs: workflow-formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Audit GitHub Actions security
        shell: bash
        run: |
          archive="$RUNNER_TEMP/zizmor.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/zizmorcore/zizmor/releases/download/v1.32.0/zizmor-x86_64-unknown-linux-gnu.tar.gz \
            --output "$archive"
          echo "bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" zizmor
          # Security findings are report-only. Scanner errors still fail the job.
          "$RUNNER_TEMP/zizmor" --offline --no-exit-codes .github

  # Use Ruff to check Python for problems like unused imports.
  lint:
    name: Python Linting
    needs: workflow-security
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check lint rules
        run: python -m ruff check .

  # Check that Python files follow Ruff's formatting rules.
  formatting:
    name: Python Formatting
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check formatting
        run: python -m ruff format --check .

  # Bandit looks for common security issues in our backend code.
  python-security:
    name: Python Security
    needs: formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Bandit
        run: python -m pip install bandit==1.9.4
      - name: Scan backend Python code
        run: python -m bandit -r src/documentation_assistant/backend

  # Check our Python packages and their dependencies for known vulnerabilities.
  dependency-security:
    name: Dependency Security
    needs: python-security
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1
      - name: Check Python dependencies for known vulnerabilities
        run: python -m pip_audit --strict --progress-spinner off -r requirements.txt

  # Run tests for individual pieces of code and save their coverage data.
  unit:
    name: Unit Tests
    needs: dependency-security
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests with coverage
        env:
          COVERAGE_FILE: .coverage.unit
        run: python -m coverage run -m pytest tests/unit -v
      - name: Upload unit coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage-unit
          path: .coverage.unit
          # A leading dot makes coverage data a hidden file.
          include-hidden-files: true
          if-no-files-found: error

  # Check how backend parts work together and save coverage separately.
  integration:
    name: Integration Tests
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run integration tests with coverage
        env:
          COVERAGE_FILE: .coverage.integration
        run: python -m coverage run -m pytest tests/integration -v
      - name: Upload integration coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage-integration
          path: .coverage.integration
          include-hidden-files: true
          if-no-files-found: error

  # Combine coverage from both test jobs into one backend report.
  coverage:
    name: Coverage Report
    needs: [unit, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download coverage data
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-*
          path: coverage-data
          merge-multiple: true
      - name: Combine and publish coverage
        run: |
          test -f coverage-data/.coverage.unit
          test -f coverage-data/.coverage.integration
          python -m coverage combine coverage-data
          # Publish the report even when coverage falls below 90% and fails the job.
          python -m coverage report --show-missing --precision=2 --fail-under=90 \
            --format=markdown >> "$GITHUB_STEP_SUMMARY"

  # Build once so all three runners test the same wheel.
  build-wheel:
    name: Build Wheel
    needs: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build the application wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Upload the wheel for validation
        uses: actions/upload-artifact@v6
        with:
          name: app-wheel-candidate
          path: dist/*.whl
          if-no-files-found: error

  validate-wheel:
    name: Validate Wheel (${{ matrix.os }})
    needs: build-wheel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Download the built wheel
        uses: actions/download-artifact@v7
        with:
          name: app-wheel-candidate
          path: dist
      - name: Install and exercise the wheel in a fresh environment
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $venv = Join-Path $env:RUNNER_TEMP 'wheel-venv'
          python -m venv $venv
          $python = Join-Path $venv $(if ($IsWindows) { 'Scripts/python.exe' } else { 'bin/python' })
          $wheel = Get-Item dist/*.whl
          & $python -m pip install $wheel.FullName
          & $python -m pip check
          & $python -I scripts/check_installed_wheel.py

  # Make the tested wheel available for a manual GitHub Release.
  upload-wheel:
    name: Upload Validated Wheel
    needs: validate-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download the validated wheel
        uses: actions/download-artifact@v7
        with:
          name: app-wheel-candidate
          path: dist
      - name: Upload the release artifact
        uses: actions/upload-artifact@v6
        with:
          name: app-wheel
          path: dist/*.whl
          if-no-files-found: error
