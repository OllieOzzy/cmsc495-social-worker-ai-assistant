name: Run live Ollama tests
description: Install Ollama and its model, then run the selected test suite.

inputs:
  suite:
    description: The live Ollama test suite to run (smoke or quality).
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install Python dependencies
      shell: bash
      run: python -m pip install -r requirements.txt

    - name: Restore Ollama and model cache
      id: ollama-cache
      uses: actions/cache@v6
      with:
        path: |
          ${{ runner.temp }}/ollama
          ${{ runner.temp }}/ollama-models
        key: ${{ runner.os }}-${{ runner.arch }}-ollama-${{ env.OLLAMA_VERSION }}-${{ env.OLLAMA_MODEL }}-v1

    - name: Install Ollama on cache miss
      if: steps.ollama-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        $ProgressPreference = 'SilentlyContinue'
        # Match the official release asset and checksum to the runner OS.
        switch ($env:RUNNER_OS) {
          'Linux' {
            $asset = 'ollama-linux-amd64.tar.zst'
            $sha256 = '87bfafb2acbc89b2e6a1be0a9043de6aa75fb450696f86bc426e65fc448f788d'
          }
          'Windows' {
            $asset = 'ollama-windows-amd64.zip'
            $sha256 = '50fcf5ad54277f2fa5d173ebfc93bcb017adbc0c9ef2314daabc96ca9e6aa64e'
          }
          'macOS' {
            $asset = 'ollama-darwin.tgz'
            $sha256 = 'a743717494315da7cd352982b805f6b992d4b4452ca117fd5fbf86c4ee46fca0'
          }
          default { throw "Unsupported Ollama runner OS $env:RUNNER_OS" }
        }

        $archive = Join-Path $env:RUNNER_TEMP $asset
        $url = "https://github.com/ollama/ollama/releases/download/v$env:OLLAMA_VERSION/$asset"
        Invoke-WebRequest -Uri $url -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 2
        if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $sha256) {
          throw "The Ollama archive checksum did not match for $asset."
        }
        $installDir = Join-Path $env:RUNNER_TEMP 'ollama'
        New-Item -ItemType Directory -Path $installDir -Force | Out-Null
        tar -xf $archive -C $installDir
        Remove-Item -LiteralPath $archive

    - name: Start Ollama and run the selected test suite
      env:
        OLLAMA_MODELS: ${{ runner.temp }}/ollama-models
        TEST_SUITE: ${{ inputs.suite }}
      shell: pwsh
      run: |
        switch ($env:TEST_SUITE) {
          'smoke' { $pytestArgs = @('tests/llm/test_live_ollama.py', '-v') }
          'quality' { $pytestArgs = @('tests/llm/test_dap_quality.py', '-v', '-s') }
          default { throw "Unknown live Ollama test suite: $env:TEST_SUITE" }
        }
        $executable = switch ($env:RUNNER_OS) {
          'Linux' { 'ollama/bin/ollama' }
          'Windows' { 'ollama/ollama.exe' }
          'macOS' { 'ollama/ollama' }
        }
        $ollama = Join-Path $env:RUNNER_TEMP $executable
        $serverArgs = @{
          FilePath = $ollama
          ArgumentList = 'serve'
          PassThru = $true
          RedirectStandardOutput = "$env:RUNNER_TEMP/ollama.stdout.log"
          RedirectStandardError = "$env:RUNNER_TEMP/ollama.log"
        }
        if ($IsWindows) { $serverArgs.WindowStyle = 'Hidden' }

        # Keep the server and pytest in the same runner step on every OS.
        $server = Start-Process @serverArgs
        $ollamaUrl = 'http://127.0.0.1:11434'
        try {
          $readyBy = (Get-Date).AddSeconds(30)
          while ($true) {
            if ($server.HasExited) { throw "Ollama exited during startup ($($server.ExitCode))." }
            try {
              Invoke-RestMethod "$ollamaUrl/api/version" -NoProxy `
                -ConnectionTimeoutSeconds 2 -OperationTimeoutSeconds 2 | Out-Null
              break
            } catch {
              if ((Get-Date) -ge $readyBy) { throw }
              Start-Sleep -Milliseconds 500
            }
          }

          # A missing model is expected on a cache miss.
          $PSNativeCommandUseErrorActionPreference = $false
          & $ollama show $env:OLLAMA_MODEL *> $null
          if ($LASTEXITCODE -ne 0) {
            & $ollama pull $env:OLLAMA_MODEL
            if ($LASTEXITCODE -ne 0) { throw 'Ollama could not pull the test model.' }
          }

          # Preload with the app's context size before timing draft generation.
          $preload = @{
            model = $env:OLLAMA_MODEL
            messages = @()
            stream = $false
            keep_alive = '10m'
            options = @{ num_ctx = 8192 }
          } | ConvertTo-Json -Depth 4 -Compress
          Invoke-RestMethod "$ollamaUrl/api/chat" -NoProxy -Method Post -ContentType 'application/json' `
            -Body $preload -ConnectionTimeoutSeconds 5 -OperationTimeoutSeconds 120 | Out-Null

          python -m pytest @pytestArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        } finally {
          if (!$server.HasExited) { Stop-Process -InputObject $server -ErrorAction SilentlyContinue }
        }

    - name: Show Ollama logs if the tests fail
      if: failure()
      shell: pwsh
      run: Get-ChildItem "$env:RUNNER_TEMP/ollama*.log" | Get-Content
