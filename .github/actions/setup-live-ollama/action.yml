name: Set up live Ollama tests
description: Install Python dependencies, restore Ollama and its model, and start the server.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install Python dependencies
      shell: bash
      run: python -m pip install -r requirements.txt

    - name: Restore Ollama and model cache
      id: ollama-cache
      uses: actions/cache@v6
      with:
        path: |
          ${{ runner.temp }}/ollama
          ${{ runner.temp }}/ollama-models
        key: ${{ runner.os }}-${{ runner.arch }}-ollama-${{ env.OLLAMA_VERSION }}-${{ env.OLLAMA_MODEL }}-v1

    - name: Install Ollama on cache miss
      if: steps.ollama-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        archive="$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
        curl --fail --silent --show-error --location --retry 3 \
          "https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst" \
          --output "$archive"
        echo "87bfafb2acbc89b2e6a1be0a9043de6aa75fb450696f86bc426e65fc448f788d  $archive" | sha256sum --check
        mkdir -p "$RUNNER_TEMP/ollama"
        tar --zstd -xf "$archive" -C "$RUNNER_TEMP/ollama"
        rm -- "$archive"

    - name: Start Ollama and prepare the model
      env:
        OLLAMA_MODELS: ${{ runner.temp }}/ollama-models
      shell: bash
      run: |
        ollama="$RUNNER_TEMP/ollama/bin/ollama"
        # Leave the server running for the test step. GitHub cleans it up at job end.
        nohup "$ollama" serve < /dev/null > "$RUNNER_TEMP/ollama.log" 2>&1 &
        curl --fail --silent --show-error --retry 15 --retry-connrefused \
          --retry-delay 1 --max-time 5 http://127.0.0.1:11434/api/version
        if ! "$ollama" show "$OLLAMA_MODEL" > /dev/null 2>&1; then
          "$ollama" pull "$OLLAMA_MODEL"
        fi
