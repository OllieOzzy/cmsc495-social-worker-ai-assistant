[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cmsc495-social-worker-ai-assistant"
version = "0.1.0"
description = "A local DAP documentation assistant for school social workers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.2",
    "httpx==0.28.1",
    "pydantic==2.14.3",
    "pypdf==7.0.1",
    "reportlab==5.1.0",
    "streamlit==1.67.0",
    "uvicorn==0.54.0",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
"documentation_assistant.backend.export" = ["templates/School_Social_Work_DAP_Session_Note.pdf"]
"documentation_assistant.backend.llm" = ["prompts/dap_generation.txt"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", # pycodestyle errors (formatting and layout)
    "F",              # Pyflakes (logic errors, unused variables/imports)
    "I",              # isort (clean, sorted imports)
    "B",              # flake8-bugbear (common design flaws and bugs)
    "UP",             # pyupgrade (automatically updates older Python syntax)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra --strict-markers --import-mode=importlib"

[tool.coverage.run]
source = ["src/documentation_assistant/backend"]
relative_files = true
